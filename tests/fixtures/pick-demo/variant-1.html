<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant 1: paper ground</title>
<style>
  :root { --ground: oklch(96% 0.02 80); --ink: oklch(22% 0.03 60); --accent: oklch(55% 0.16 40); }
  body { margin: 0; min-height: 100vh; font: 18px/1.6 Georgia, serif; color: var(--ink);
    background: linear-gradient(168deg, color-mix(in oklch, var(--ground) 94%, white), var(--ground) 46%, color-mix(in oklch, var(--ground) 92%, black)); }
  main { max-inline-size: 60ch; padding: 12vh 6vw; }
  h1 { font-size: clamp(2.4rem, 7vw, 5rem); line-height: 1; letter-spacing: -0.02em; margin: 0 0 1rem; }
  p { max-inline-size: 45ch; }
  button { font: inherit; padding: 0.8rem 1.4rem; border: 2px solid var(--ink); background: var(--accent); color: white; }
</style>
</head>
<body>
<main>
  <h1>Tide tables for the Wadden coast</h1>
  <p>Departure windows for the ferry, read against tonight's water level and the wind forecast.</p>
  <button type="button">Plan the crossing</button>
</main>
</body>
</html>
