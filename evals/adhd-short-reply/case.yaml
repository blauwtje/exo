schema_version: "1.1"
name: adhd-short-reply
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What does git rebase do?
graders:
  - name: criteria
    type: llm
    weight: 1
    criteria: |
      Pass when the reply opens with the answer in its first sentence, has no heading, greeting or closing summary, uses everyday words with technical names only as commands or names, and stays under about 150 words outside code blocks. A short example and one warning are allowed.
