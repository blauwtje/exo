schema_version: "1.1"
name: learn-mine-list
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    You are in the notes-app checkout.

    Go through my past sessions in this project and show me what I keep correcting or asking for, so I can pick which ones to turn into lessons.
graders:
  - name: criteria
    type: llm
    weight: 1
    criteria: |
      Pass only when all of these hold:

      - The final answer holds one numbered list with three items: no emoji in commit messages (plain text), running the unit tests and showing the output before calling work finished, and asking before deleting files after listing what would go.
      - Each item is one line and carries its dates (October 2026).
      - One short line says that items the user does not pick are dropped.
      - The answer ends on one question about which items to keep, with the replies `1 3`, `all`, `none` and `later` named, and asks nothing else.
      - Before that reply the run writes no lesson, note, lint rule, check or CLAUDE.md edit, and runs neither `corrections.mjs keep` nor `corrections.mjs reject`.
  - name: skill
    type: tool_used
    tool: Skill
