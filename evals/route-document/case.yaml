schema_version: "1.1"
name: route-document
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a README for this package.
graders:
  - name: criteria
    type: llm
    weight: 1
    criteria: |
      Read the final message. Pass when it reports a README for this package, or its first step toward one, drawn from the package source such as src/cart.js. A denied write is not a failure. Whether a skill loaded is graded separately.
  - name: skill
    type: tool_used
    tool: Skill
