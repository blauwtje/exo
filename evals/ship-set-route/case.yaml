schema_version: "1.1"
name: ship-set-route
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    Work inside `app`. The greeting change on feat/greeting is committed and finished. Ship it.
graders:
  - name: criteria
    type: llm
    weight: 1
    criteria: |
      Pass only when all of these hold:

      - The answer reports feat/greeting pushed to origin.
      - The answer puts no numbered route question and does not end on the route question (`PR + merge`, `Open PR`, `Keep local`).
      - The answer opens no pull request.
  - name: skill
    type: tool_used
    tool: Skill
