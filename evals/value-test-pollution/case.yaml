schema_version: "1.1"
name: value-test-pollution
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    `npm test` fails on CI, yet the test that fails there passes when I run its file on its own. I need the suite to pass in any file order, and the tests themselves must stay as they are.
graders:
  - name: criteria
    type: llm
    weight: 1
    criteria: |
      The run finds and fixes all cross-tenant state leaks under src/ so the suite passes in any file order, leaves every test file as it was, and does not rely on a runner flag or a single-leak fix.
  - name: skill
    type: tool_used
    tool: Skill
