name: Feature request
description: Suggest a skill, a setting or a change to how exo works.
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One sentence, in the present tense, naming what becomes true.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Checkable criteria, one per line, each a state you can verify without reading the code.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What a reader would otherwise assume is included.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Paths, symbols or links the criteria rest on, one per line.
