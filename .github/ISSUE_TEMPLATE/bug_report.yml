name: Bug report
description: A skill, hook or command does something wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: One or two sentences naming what exo does today.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The prompts or commands that produce it, in order.
      placeholder: |
        1. Start a session in a repository.
        2. Ask ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The exo release, the CLI version from `claude --version`, and your operating system, one per line.
      placeholder: |
        exo 0.20.0
        claude 2.0.0
        macOS 15.5
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The relevant output or transcript lines only. Remove secrets first.
      render: text
