name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run; a run on main is
# never cancelled, so every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22 is the floor verify.mjs enforces; 24 is current.
        node: [22, 24]
        # The floor is a Node concern, covered on Linux; macOS catches shell,
        # path and file-system differences on the current Node.
        exclude:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace check reads the diff, which needs more than one commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The full self-test runs once, on the current Node; the floor runs only the validator.
      - if: matrix.node == 24
        run: npm run check
      - if: matrix.node != 24
        run: npm run validate
